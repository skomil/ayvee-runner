[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ayvee-runner-client"
version = "0.1.0"
description = "Python client for the ayvee-runner service: spawn, list, and kill tmux and headless Claude Code sessions, and monitor runner health."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ayvee" }]
keywords = ["ayvee", "claude", "claude-code", "tmux", "runner", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/skomil/ayvee-runner"
Repository = "https://github.com/skomil/ayvee-runner"
Issues = "https://github.com/skomil/ayvee-runner/issues"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ayvee_runner_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
